<!DOCTYPE html>
<html>
<head>
  <title>Dutch WS Test</title>
</head>
<body>
  <h3>WebSocket test</h3>
  <p>
    Room ID: <input id="roomId" size="40">
    Player name: <input id="playerName" value="Alice">
    <button onclick="connect()">Connect</button>
  </p>
  <p>
    <button onclick="draw()">Draw</button>
  </p>
  <p>
    Position: <input id="swapPos" size="3" value="0">
    <button onclick="swap()">Swap</button>
  </p>
  <p>
    <button onclick="discard()">Discard</button>
  </p>
  <p>
    <button onclick="call_dutch()">Call Dutch</button>
  </p>
  <p>
    <button onclick="skip_ability()">Skip Ability</button>
  </p>
  <p>
    Player A: <input id="playerA">
    Position A: <input id="posA" size="3" value="0">
    Player B: <input id="playerB">
    Position B: <input id="posB" size="3" value="0">
    <button onclick="use_ability()">Use Ability</button>
  </p>  
  <pre id="log" style="background:#eee; padding:10px; height:300px; overflow:auto;"></pre>

  <script>
    let ws = null;

    function log(msg) {
      document.getElementById("log").textContent += msg + "\n";
    }

    function connect() {
      const roomId = document.getElementById("roomId").value;
      const name = document.getElementById("playerName").value;
      ws = new WebSocket(`ws://127.0.0.1:8000/rooms/${roomId}/ws/${name}`);

      ws.onopen = () => log("connected as " + name);
      ws.onmessage = (event) => log("received: " + event.data);
      ws.onclose = (event) => log("closed: code=" + event.code + " reason=" + event.reason);
      ws.onerror = (event) => log("error!");
    }

    function draw() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({action: "draw"}));
        log("sent: draw");
      } else {
        log("not connected");
      }
    }

    function swap() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        const pos = parseInt(document.getElementById("swapPos").value);
        ws.send(JSON.stringify({action: "swap", position: pos}));
        log("sent: swap " + pos);
      } else {
        log("not connected");
      }
    }

    function discard() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({action: "discard"}));
        log("sent: discard");
      } else {
        log("not connected");
      }
    }

    function call_dutch() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({action: "call_dutch"}));
        log("sent: call_dutch");
      } else {
        log("not connected");      
      }
    }

    function skip_ability() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({action: "skip_ability"}));
        log("sent: skip_ability");
      } else {
        log("not connected");
      }
    }

    function use_ability() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        const playera = document.getElementById("playerA").value;
        const posa = parseInt(document.getElementById("posA").value);
        const playerb = document.getElementById("playerB").value;
        const posb = parseInt(document.getElementById("posB").value);               
        ws.send(JSON.stringify({
          action: "use_ability", 
          target1_player: playera, 
          target1_pos: posa, 
          target2_player: playerb, 
          target2_pos: posb}));
        log("sent: use_ability" + playera + "" + posa + "" + playerb + "" + posb);
      } else {
        log("not connected");
      }
    }   
    
  </script>
</body>
</html>
